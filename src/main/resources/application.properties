quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME:root}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/proyectopg3}
quarkus.hibernate-orm.database.generation=update
quarkus.mailer.from=${MAIL_FROM:onboarding@resend.dev}
quarkus.mailer.host=${MAIL_HOST:smtp.resend.com}
quarkus.mailer.port=${MAIL_PORT:465}
quarkus.mailer.username=${MAIL_USERNAME:resend}
quarkus.mailer.password=${MAIL_PASSWORD}
quarkus.mailer.start-tls=OPTIONAL
quarkus.mailer.ssl=true
quarkus.mailer.login=REQUIRED
quarkus.http.port=${HTTP_PORT:8081}
quarkus.scheduler.enabled=true

app.reports.output-dir=${REPORTS_OUTPUT_DIR:.}
app.mail.admin-recipient=${ADMIN_MAIL_RECIPIENT}

# Documentacion de la API (OpenAPI + Swagger UI)
quarkus.smallrye-openapi.info-title=API Portafolio de Proyectos
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST del portafolio de proyectos de Jairo Castillo. Permite consultar los proyectos publicados y los comentarios de los visitantes, y registrar nuevos comentarios. Cada comentario registrado genera un correo de agradecimiento al visitante y se agrega al reporte CSV diario que se envia al administrador.
quarkus.smallrye-openapi.info-license-name=MIT
quarkus.smallrye-openapi.info-license-url=https://opensource.org/licenses/MIT
quarkus.swagger-ui.always-include=true
